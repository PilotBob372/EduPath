# ── Основной конфиг (HTTPS + HTTP→HTTPS редирект)
# Активируется после получения SSL-сертификата от Let's Encrypt

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name edupath.biz www.edupath.biz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name edupath.biz www.edupath.biz;

        ssl_certificate     /etc/letsencrypt/live/edupath.biz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/edupath.biz/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # API proxy (включая SSE-стриминг)
        location /api/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_buffering    off;   # нужно для SSE (чат)
        }

        # Static frontend
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;

            # Кэш для статических ассетов
            location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
