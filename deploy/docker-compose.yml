version: "3.9"

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: edupath
      POSTGRES_USER: edupath
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edupath"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API server (Node.js / Express) ─────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: always
    environment:
      PORT: 8080
      NODE_ENV: production
      DATABASE_URL: postgresql://edupath:${DB_PASSWORD}@db:5432/edupath
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_INTEGRATIONS_ANTHROPIC_BASE_URL: ${AI_INTEGRATIONS_ANTHROPIC_BASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
    depends_on:
      db:
        condition: service_healthy

  # ── nginx (static files + reverse proxy) ──────────────────────────────────
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - api

  # ── Certbot (Let's Encrypt SSL — run manually, see setup.sh) ──────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      certbot certonly --webroot
        --webroot-path=/var/www/certbot
        --email ${CERTBOT_EMAIL}
        --agree-tos
        --no-eff-email
        -d edupath.biz
        -d www.edupath.biz

volumes:
  postgres_data:
